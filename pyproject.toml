[project]
name = "aar"
version = "0.1.0"
description = "Automated Alignment Researcher harness (multi-benchmark safety-property hillclimbing)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    # PyPI's torch 2.14 aarch64 wheel includes CUDA 13 support for GB300. Keep
    # the repository's established torch 2.8 stack everywhere else.
    "torch==2.14.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch==2.8.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
    # Stable Transformers 5.17 recognizes Qwen3.5 and uses the compatible
    # tokenizers 0.23 series. Preserve the historical versions off ARM Linux.
    "transformers==5.17.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers[hf_xet]>=4.51.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "tokenizers>=0.23.1,<0.24; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "tokenizers==0.22.1; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "datasets==3.6.0",
    "accelerate==1.12.0",
    "peft==0.18.0",
    "trl==0.21.0",
    "bitsandbytes==0.46.1",
    "safetensors>=0.8.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "safetensors==0.7.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "einops==0.8.1",
    "triton==3.4.0; platform_machine == 'x86_64' and sys_platform == 'linux'",
    # Fast training (Unsloth + LoRA). These packages depend on the x86-only
    # Triton wheels, so PEFT is the portable training path on Linux aarch64.
    "unsloth==2025.10.12; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "unsloth-zoo==2025.10.13; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "liger-kernel==0.6.4; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "cut-cross-entropy==25.1.1; platform_machine == 'x86_64' and sys_platform == 'linux'",
    # Fast inference
    "vllm==0.11.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
    # The pinned wheel below is Linux x86_64 + CPython 3.12 only. Other
    # architectures use the attention implementations provided by PyTorch/vLLM.
    "flash-attn; platform_machine == 'x86_64' and sys_platform == 'linux'",
    # Scientific computing
    "scipy==1.16.3",
    "numpy<2.0.0",
    "scikit-learn==1.7.2",
    # Utils
    "tqdm==4.67.1",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "jinja2>=3.0",
    "httpx==0.28.1",
    "requests>=2.28.0",
    "packaging==25.0",
    "hf-transfer",
    "pylatexenc",
    "nvidia-ml-py>=12.560.30",
    # Tracking
    "wandb==0.23.0",
    # Agent
    "anthropic>=0.78.0",
    "claude_agent_sdk==0.2.157",
    # Server
    "flask>=3.1.2",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.1",
    # Cloud
    "boto3>=1.28.0",
    "runpod>=1.5.0",
    # Dev
    "pytest",
    "ruff",
    # Extra inference
    # `all` pulls x86-only sgl-kernel and decord wheels.
    "sglang[all]==0.5.2; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "flashinfer-python==0.3.1; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torch-memory-saver; sys_platform != 'linux' or platform_machine != 'aarch64'",
    # VERL
    "ray[default]==2.52.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "tensordict>=0.8.0,<=0.10.0,!=0.9.0",
    "codetiming",
    "dill",
    "pybind11",
    "optree>=0.13.0",
    "grpcio>=1.62.1",
    # Extra tracking
    "weave==0.52.22",
    "tensorboard==2.20.0",
    # Extra utils
    "torchdata",
    "aiohttp==3.13.2",
    "fastapi[standard]>=0.115.0",
    "uvicorn==0.38.0",
    "pydantic>=2.9",
    "pyarrow>=15.0.0",
    "attrs==25.4.0",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "rich==14.2.0",
    "loguru==0.7.3",
    "ninja==1.13.0",
    "qwen-vl-utils",
    "mathruler",
    # The pinned release requires Transformers <5 and is not used by the
    # 20260919 direct Hugging Face smoke path.
    "sentence-transformers==5.1.2; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "opencv-python",
    "opencv-fixer",
    "py-spy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aar"]

[tool.uv]
# Override conflicting dependencies
override-dependencies = [
    "setuptools>=79.0.0",
    "torchao>=0.13.0",  # unsloth needs >=0.13.0, sglang wants ==0.9.0
    "xgrammar==0.1.25",  # vllm needs ==0.1.25, sglang wants ==0.1.24
    "outlines-core==0.2.11",  # vllm needs ==0.2.11, sglang wants ==0.1.26
]

[tool.uv.sources]
# flash-attn from pre-built wheel (Linux x86_64, CUDA 12, torch2.8,
# cxx11abi=False, CPython 3.12). The project dependency marker excludes this
# source on non-matching platforms such as Linux aarch64.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.1/flash_attn-2.8.1+cu12torch2.8cxx11abiFALSE-cp312-cp312-linux_x86_64.whl" }
