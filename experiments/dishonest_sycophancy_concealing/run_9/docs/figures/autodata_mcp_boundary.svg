<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .label { font: 700 19px sans-serif; fill: #0f172a; }
      .body { font: 15px sans-serif; fill: #334155; }
      .small { font: 14px sans-serif; fill: #475569; }
      .purple-small { font: 14px sans-serif; fill: #6d28d9; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 6; fill: none; marker-end: url(#purple-arrow); }
      .purple { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#purple-arrow); }
    </style>
  </defs>
  <rect width="1400" height="780" fill="#f8fafc"/>
  <text x="700" y="45" text-anchor="middle" class="title">How AAR and AutoData Integration Works</text>

  <rect x="30" y="95" width="270" height="180" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="165" y="132" text-anchor="middle" class="label">Research agent</text>
  <text x="165" y="164" text-anchor="middle" class="body">Claude in a restricted</text>
  <text x="165" y="189" text-anchor="middle" class="body">Bubblewrap sandbox</text>
  <text x="165" y="229" text-anchor="middle" class="small">Cannot approve its own action</text>
  <text x="165" y="252" text-anchor="middle" class="small">Cannot access signing key</text>

  <rect x="390" y="80" width="280" height="210" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="530" y="117" text-anchor="middle" class="label">AutoData CLI</text>
  <text x="530" y="150" text-anchor="middle" class="body">workspace create / step</text>
  <text x="530" y="175" text-anchor="middle" class="body">execution create / step</text>
  <text x="530" y="200" text-anchor="middle" class="body">action begin / complete</text>
  <text x="530" y="225" text-anchor="middle" class="body">status / export</text>
  <text x="530" y="263" text-anchor="middle" class="small">Existing plugin wrapper</text>

  <rect x="760" y="80" width="250" height="210" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="885" y="117" text-anchor="middle" class="label">AutoData core</text>
  <text x="885" y="150" text-anchor="middle" class="body">ExecutionEngine</text>
  <text x="885" y="175" text-anchor="middle" class="body">SQLite state</text>
  <text x="885" y="200" text-anchor="middle" class="body">Artifacts + lifecycle</text>
  <text x="885" y="225" text-anchor="middle" class="body">Creates pending actions</text>
  <text x="885" y="263" text-anchor="middle" class="small">AutoData-owned logic</text>

  <rect x="1100" y="80" width="260" height="210" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1230" y="117" text-anchor="middle" class="label">Broker</text>
  <text x="1230" y="150" text-anchor="middle" class="body">local-bwrap jobs</text>
  <text x="1230" y="175" text-anchor="middle" class="body">Kimi generation</text>
  <text x="1230" y="200" text-anchor="middle" class="body">Luna judging</text>
  <text x="1230" y="250" text-anchor="middle" class="small">Task execution only</text>

  <path d="M300 155 L390 155" class="arrow"/>
  <text x="345" y="139" text-anchor="middle" class="small">Bash</text>
  <path d="M670 175 L760 175" class="arrow"/>
  <path d="M1010 175 L1100 175" class="arrow"/>

  <path d="M390 235 L300 235" class="dash"/>
  <text x="345" y="220" text-anchor="middle" class="purple-small">pending action + ID</text>

  <rect x="350" y="390" width="520" height="260" class="box" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="610" y="430" text-anchor="middle" class="label">Trusted AAR approval bridge (MCP tool)</text>
  <text x="610" y="466" text-anchor="middle" class="body">review_autodata_action(action_id)</text>
  <text x="610" y="501" text-anchor="middle" class="body">Loads pending action + content-addressed evidence</text>
  <text x="610" y="529" text-anchor="middle" class="body">Runs deterministic checks + proposal binding</text>
  <text x="610" y="557" text-anchor="middle" class="body">Asks monitor for semantic verdict</text>
  <text x="610" y="585" text-anchor="middle" class="body">Signs verdict, writes audit, invokes AutoData CLI</text>
  <text x="610" y="620" text-anchor="middle" class="small">Owns signing key; monitor and agent do not</text>

  <rect x="980" y="420" width="380" height="200" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1170" y="460" text-anchor="middle" class="label">AAR integrity monitor</text>
  <text x="1170" y="497" text-anchor="middle" class="body">Semantic judgment only</text>
  <text x="1170" y="526" text-anchor="middle" class="body">No AutoData tools or workspace writes</text>
  <text x="1170" y="555" text-anchor="middle" class="body">No approval signing key</text>
  <text x="1170" y="590" text-anchor="middle" class="small">Returns approve/revise verdict + feedback</text>

  <path d="M165 275 C165 355 280 405 350 450" class="dash"/>
  <text x="205" y="350" class="purple-small">request review(action_id)</text>

  <path d="M540 390 C530 345 500 326 490 290" class="dash"/>
  <text x="550" y="340" class="purple-small">read + complete native action</text>

  <path d="M870 490 L980 490" class="purple"/>
  <text x="925" y="474" text-anchor="middle" class="purple-small">immutable package</text>
  <path d="M980 550 L870 550" class="purple"/>
  <text x="925" y="575" text-anchor="middle" class="purple-small">verdict</text>

  <rect x="30" y="705" width="1330" height="46" rx="10" fill="#e2e8f0"/>
  <text x="695" y="733" text-anchor="middle" class="body">AutoData creates the gate; the agent requests review; the trusted bridge validates, asks the monitor, signs, and completes the native action.</text>
</svg>
