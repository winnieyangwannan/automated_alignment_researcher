<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #526079; }
      .section { font: 700 23px Arial, sans-serif; fill: #172033; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #172033; }
      .body { font: 400 15px Arial, sans-serif; fill: #2c3850; }
      .small { font: 400 13px Arial, sans-serif; fill: #526079; }
      .tag { font: 700 13px Arial, sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .fixed { fill: #f2f4f8; stroke: #aeb7c8; stroke-width: 2; }
      .mutable { fill: #e5f7e9; stroke: #399455; stroke-width: 2.5; }
      .approved { fill: #eee9ff; stroke: #7457c7; stroke-width: 2.5; }
      .process { fill: #eaf3ff; stroke: #3f78b5; stroke-width: 2; }
      .warning { fill: #fff0ed; stroke: #c65342; stroke-width: 2; }
      .band-task { fill: #f5fbff; stroke: #74a5d5; stroke-width: 2.5; }
      .band-meta { fill: #fffaf0; stroke: #d49b37; stroke-width: 2.5; }
      .band-aar { fill: #f8f5ff; stroke: #8064c6; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #526079; stroke-width: 2.4; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #b07821; stroke-width: 2.6; stroke-dasharray: 8 6; marker-end: url(#arrow-orange); }
      .outer-loop { fill: none; stroke: #7457c7; stroke-width: 2.8; stroke-dasharray: 9 6; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#526079"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b07821"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7457c7"/>
    </marker>
  </defs>

  <rect width="1800" height="1220" fill="#ffffff"/>
  <text x="70" y="54" class="title">AutoData inside AAR: three nested optimization loops</text>
  <text x="70" y="84" class="subtitle">Gray = fixed in the current execution · Green = mutable at this level · Purple = changeable only through a new approved AAR workspace</text>

  <!-- Recipe anatomy -->
  <rect x="45" y="110" width="1710" height="220" rx="20" fill="#fbfcfe" stroke="#ccd3df" stroke-width="2"/>
  <text x="70" y="146" class="section">1. What is a recipe?</text>
  <text x="305" y="146" class="body">The complete versioned folder that tells AutoData what data to generate, how to run it, and how to choose a winner.</text>

  <rect x="70" y="170" width="245" height="125" rx="13" class="approved"/>
  <text x="90" y="198" class="box-title">Grounding</text>
  <text x="90" y="223" class="body"><tspan x="90">What scenarios exist:</tspan><tspan x="90" dy="21">domains, pressure patterns,</tspan><tspan x="90" dy="21">axes, task IDs and seeds.</tspan></text>

  <rect x="330" y="170" width="245" height="125" rx="13" class="approved"/>
  <text x="350" y="198" class="box-title">Pipeline</text>
  <text x="350" y="223" class="body"><tspan x="350">How to execute: command,</tspan><tspan x="350" dy="21">timeouts, checks, mutable</tspan><tspan x="350" dy="21">and protected paths.</tspan></text>

  <rect x="590" y="170" width="245" height="125" rx="13" class="fixed"/>
  <text x="610" y="198" class="box-title">Task + strategy</text>
  <text x="610" y="223" class="body"><tspan x="610">Task code calls Kimi, optional</tspan><tspan x="610" dy="21">Gemma, and Luna. Strategy</tspan><tspan x="610" dy="21">contains the mutable prompt.</tspan></text>

  <rect x="850" y="170" width="245" height="125" rx="13" class="fixed"/>
  <text x="870" y="198" class="box-title">Schemas</text>
  <text x="870" y="223" class="body"><tspan x="870">JSON shape rules: required</tspan><tspan x="870" dy="21">fields, types, limits. They</tspan><tspan x="870" dy="21">do not judge semantic quality.</tspan></text>

  <rect x="1110" y="170" width="245" height="125" rx="13" class="fixed"/>
  <text x="1130" y="198" class="box-title">Objective + comparator</text>
  <text x="1130" y="223" class="body"><tspan x="1130">What “better” means: maximize</tspan><tspan x="1130" dy="21">quality, require validity, and</tspan><tspan x="1130" dy="21">set meaningful improvement.</tspan></text>

  <rect x="1370" y="170" width="355" height="125" rx="13" class="warning"/>
  <text x="1390" y="198" class="box-title">Evaluator boundary</text>
  <text x="1390" y="223" class="body"><tspan x="1390">Hidden AAR benchmarks are not recipe inputs.</tspan><tspan x="1390" dy="21">AutoData never reads them or changes them.</tspan><tspan x="1390" dy="21">Only protected evaluation returns a score.</tspan></text>

  <!-- Per-task loop -->
  <rect x="45" y="355" width="1710" height="230" rx="20" class="band-task"/>
  <text x="70" y="392" class="section">2. Per-task data loop</text>
  <rect x="270" y="372" width="126" height="27" rx="13" fill="#3f78b5"/>
  <text x="289" y="391" class="tag">NO FILE CHANGES</text>

  <rect x="75" y="430" width="220" height="105" rx="13" class="fixed"/>
  <text x="95" y="458" class="box-title">Grounded scenario</text>
  <text x="95" y="483" class="body"><tspan x="95">One task payload</tspan><tspan x="95" dy="21">with fixed ID + seed</tspan></text>

  <path d="M295 482 L345 482" class="arrow"/>
  <rect x="350" y="430" width="220" height="105" rx="13" class="process"/>
  <text x="370" y="458" class="box-title">Kimi teacher</text>
  <text x="370" y="483" class="body"><tspan x="370">Generate prompt +</tspan><tspan x="370" dy="21">ideal response</tspan></text>

  <path d="M570 482 L620 482" class="arrow"/>
  <rect x="625" y="430" width="230" height="105" rx="13" class="process"/>
  <text x="645" y="458" class="box-title">Current Gemma probe</text>
  <text x="645" y="483" class="body"><tspan x="645">Optional research endpoint:</tspan><tspan x="645" dy="21">does the student fail?</tspan></text>

  <path d="M855 482 L905 482" class="arrow"/>
  <rect x="910" y="430" width="230" height="105" rx="13" class="process"/>
  <text x="930" y="458" class="box-title">Luna judge</text>
  <text x="930" y="483" class="body"><tspan x="930">Teacher quality +</tspan><tspan x="930" dy="21">material target failure</tspan></text>

  <path d="M1140 482 L1190 482" class="arrow"/>
  <rect x="1195" y="430" width="220" height="105" rx="13" class="fixed"/>
  <text x="1215" y="458" class="box-title">Schema validation</text>
  <text x="1215" y="483" class="body"><tspan x="1215">Correct JSON shape,</tspan><tspan x="1215" dy="21">metrics and provenance</tspan></text>

  <path d="M1415 482 L1465 482" class="arrow"/>
  <rect x="1470" y="430" width="240" height="105" rx="13" class="mutable"/>
  <text x="1490" y="458" class="box-title">Row result</text>
  <text x="1490" y="483" class="body"><tspan x="1490">Accepted row, or rejection;</tspan><tspan x="1490" dy="21">quality/valid/challenge metrics</tspan></text>
  <text x="75" y="562" class="small">What changes here: only generated outputs and measurements. The recipe snapshot, rubric, schemas, grounding and strategy files do not change.</text>

  <!-- AutoData meta loop -->
  <rect x="45" y="610" width="1710" height="330" rx="20" class="band-meta"/>
  <text x="70" y="647" class="section">3. AutoData meta-optimization loop</text>
  <rect x="430" y="627" width="198" height="27" rx="13" fill="#399455"/>
  <text x="451" y="646" class="tag">ONE ALLOWLISTED FILE</text>

  <rect x="75" y="680" width="280" height="205" rx="13" class="fixed"/>
  <text x="95" y="710" class="box-title">Frozen execution contract</text>
  <text x="95" y="739" class="body"><tspan x="95">• Grounding + task splits</tspan><tspan x="95" dy="24">• task.py and Luna rubric</tspan><tspan x="95" dy="24">• Schemas and checks</tspan><tspan x="95" dy="24">• Objective + comparator</tspan><tspan x="95" dy="24">• Endpoints, budget, concurrency</tspan><tspan x="95" dy="24">• Protected files</tspan></text>

  <rect x="405" y="690" width="210" height="90" rx="13" class="process"/>
  <text x="425" y="718" class="box-title">Evaluate incumbent</text>
  <text x="425" y="744" class="body"><tspan x="425">Run task loop on tuning</tspan><tspan x="425" dy="21">and hidden validation sets</tspan></text>
  <path d="M615 735 L665 735" class="arrow"/>

  <rect x="670" y="690" width="210" height="90" rx="13" class="process"/>
  <text x="690" y="718" class="box-title">Analyze visible evidence</text>
  <text x="690" y="744" class="body"><tspan x="690">See tuning results;</tspan><tspan x="690" dy="21">propose one scoped change</tspan></text>
  <path d="M880 735 L930 735" class="arrow"/>

  <rect x="935" y="675" width="260" height="120" rx="13" class="mutable"/>
  <text x="955" y="704" class="box-title">Mutate generation_strategy.json</text>
  <text x="955" y="732" class="body"><tspan x="955">✓ system prompt</tspan><tspan x="955" dy="22">✓ scenario prompt prefix</tspan><tspan x="955" dy="22">✓ temperature</tspan></text>
  <path d="M1195 735 L1245 735" class="arrow"/>

  <rect x="1250" y="690" width="210" height="90" rx="13" class="process"/>
  <text x="1270" y="718" class="box-title">Paired comparison</text>
  <text x="1270" y="744" class="body"><tspan x="1270">Same hidden tasks + seeds;</tspan><tspan x="1270" dy="21">apply validity constraints</tspan></text>
  <path d="M1460 735 L1510 735" class="arrow"/>

  <rect x="1515" y="690" width="195" height="90" rx="13" class="process"/>
  <text x="1535" y="718" class="box-title">Keep winner</text>
  <text x="1535" y="744" class="body"><tspan x="1535">Accept or reject</tspan><tspan x="1535" dy="21">candidate</tspan></text>

  <path d="M1610 785 C1610 900 510 910 510 785" class="loop"/>
  <text x="900" y="905" class="body">Repeat within the fixed budget (Run 9: exactly 3 meta iterations), then export a digest-bound winner</text>
  <text x="75" y="925" class="small">Production is separate: run the frozen winner over fresh production grounding with max_iterations = 0; no mutation occurs there.</text>

  <!-- AAR outer loop -->
  <rect x="45" y="965" width="1710" height="210" rx="20" class="band-aar"/>
  <text x="70" y="1002" class="section">4. AAR meta-meta loop between AAR iterations</text>
  <rect x="545" y="982" width="224" height="27" rx="13" fill="#7457c7"/>
  <text x="566" y="1001" class="tag">NEW WORKSPACE + APPROVAL</text>

  <rect x="75" y="1030" width="205" height="90" rx="13" class="process"/>
  <text x="95" y="1058" class="box-title">Visible score + finding</text>
  <text x="95" y="1084" class="body"><tspan x="95">What helped, failed,</tspan><tspan x="95" dy="21">or bottlenecked?</tspan></text>
  <path d="M280 1075 L325 1075" class="arrow"/>

  <rect x="330" y="1020" width="330" height="110" rx="13" class="approved"/>
  <text x="350" y="1048" class="box-title">Redesign recipe or grounding</text>
  <text x="350" y="1074" class="body"><tspan x="350">May change pipeline/task/schema/objective,</tspan><tspan x="350" dy="21">mutable boundary, target probing, coverage,</tspan><tspan x="350" dy="21">or training method—subject to approval.</tspan></text>
  <path d="M660 1075 L705 1075" class="arrow"/>

  <rect x="710" y="1030" width="200" height="90" rx="13" class="approved"/>
  <text x="730" y="1058" class="box-title">Fresh approvals</text>
  <text x="730" y="1084" class="body"><tspan x="730">Grounding, baseline,</tspan><tspan x="730" dy="21">resources; then freeze</tspan></text>
  <path d="M910 1075 L955 1075" class="arrow"/>

  <rect x="960" y="1030" width="220" height="90" rx="13" class="process"/>
  <text x="980" y="1058" class="box-title">AutoData meta loop</text>
  <text x="980" y="1084" class="body"><tspan x="980">Optimize strategy, export</tspan><tspan x="980" dy="21">winner, generate production</tspan></text>
  <path d="M1180 1075 L1225 1075" class="arrow"/>

  <rect x="1230" y="1030" width="205" height="90" rx="13" class="process"/>
  <text x="1250" y="1058" class="box-title">Train current Gemma</text>
  <text x="1250" y="1084" class="body"><tspan x="1250">Consume verified dataset;</tspan><tspan x="1250" dy="21">merge candidate adapter</tspan></text>
  <path d="M1435 1075 L1480 1075" class="arrow"/>

  <rect x="1485" y="1030" width="225" height="90" rx="13" class="warning"/>
  <text x="1505" y="1058" class="box-title">Protected AAR evaluation</text>
  <text x="1505" y="1084" class="body"><tspan x="1505">Hidden benchmarks →</tspan><tspan x="1505" dy="21">published score/finding</tspan></text>

  <path d="M1595 1128 C1595 1195 175 1195 175 1128" class="outer-loop"/>
  <text x="650" y="1162" class="small">Next AAR iteration may fork from visible findings. It may never use hidden evaluator inputs, edit a frozen workspace, expose credentials, or weaken controls to chase acceptance.</text>

  <text x="70" y="1205" class="small">Run 9 implementation view · recipe inner mutation: recipe/generation_strategy.json only · outer redesign requires a new/forked workspace and fresh native approval</text>
</svg>
