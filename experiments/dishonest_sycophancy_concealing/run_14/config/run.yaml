version: 1

storage:
  root: /checkpoint/ram/aar/{user}/run14_native_generation
  keep_checkpoints: false

research:
  seeds:
    - alpha
    - beta
    - gamma
    - delta
    - epsilon
  # Match Run 12's scientific target while allowing three failed sessions.
  target_score_result_pairs: 5
  max_sessions_per_chain: 8
  walltime_hours: 167

training:
  time_limit: 06:00:00
  # Each chain owns a separate team, so this is one training lane per chain.
  max_concurrent_jobs: 1

evaluation:
  memory: max
  max_truncation_rate: 0.20
  # The pipeline launches one isolated evaluator for each chain.
  workers: 1
  gpus_per_worker: 4
  time_limit: 7-00:00:00
  idle_seconds: 604200
  on_demand: false

agent:
  backend: kimi
  turn_timeout_seconds: 1800
  preflight_timeout_seconds: 180
  preflight_cache_ttl_seconds: 21600

data_generation:
  # The research model authors and validates each method's data-generation code.
  # No AutoData plugin, broker, recipe, workspace, or production export is used.
  backend: native
