version: 1

lifecycle:
  name: one_chain_lifecycle_check
  prerequisite_chain_count: 0

storage:
  root: /checkpoint/ram/aar/{user}/run10_kimi
  # The evaluator consumes the exact adapter produced by the GPU preflight.
  keep_checkpoints: true

research:
  seeds:
    - lifecycle
  max_sessions_per_chain: 1
  walltime_hours: 2

training:
  mode: one_step_gpu_preflight
  time_limit: 00:15:00
  max_concurrent_jobs: 1

evaluation:
  memory: max
  max_truncation_rate: 0.20
  benchmarks:
    - verbalized_ece
  items_per_benchmark: 2
  workers: 1
  gpus_per_worker: 1
  time_limit: 01:00:00
  idle_seconds: 120
  on_demand: true

agent:
  backend: kimi
  turn_timeout_seconds: 1800
  preflight_timeout_seconds: 300
  preflight_cache_ttl_seconds: 21600
