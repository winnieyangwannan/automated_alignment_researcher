version: 1

storage:
  root: /checkpoint/ram/aar/{user}/run10_kimi
  # The on-demand evaluator consumes the exact adapter produced by the preflight.
  keep_checkpoints: true

research:
  seeds:
    - lifecycle
  max_sessions_per_chain: 1
  walltime_hours: 2

training:
  # This existing contract means one real CUDA optimizer step on at most eight
  # examples, followed by PEFT adapter save and reload validation.
  mode: one_step_gpu_preflight
  time_limit: 00:15:00

evaluation:
  memory: max
  max_truncation_rate: 0.20
  benchmarks:
    - verbalized_ece
  items_per_benchmark: 2
  workers: 1
  # One benchmark needs one evaluator GPU; requesting more would be idle.
  gpus_per_worker: 1
  time_limit: 01:00:00
  idle_seconds: 120
  on_demand: true

agent:
  backend: kimi
  turn_timeout_seconds: 1800
  # A changed Kimi stack gets one bounded fresh protocol proof. Matching proofs
  # are reusable after a fast authenticated endpoint-health check.
  preflight_timeout_seconds: 300
  preflight_cache_ttl_seconds: 21600
