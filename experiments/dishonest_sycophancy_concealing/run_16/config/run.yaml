version: 1

storage:
  root: /checkpoint/ram/aar/{user}/run16_native_generation
  keep_checkpoints: false

research:
  seeds:
    - alpha
    - beta
    - gamma
    - delta
    - epsilon
  # Full Run 16 target: 50 successful score/finding pairs per chain.
  # The 60-session ceiling leaves room for up to 10 unsuccessful sessions.
  target_score_result_pairs: 50
  max_sessions_per_chain: 60
  walltime_hours: 167

training:
  time_limit: 06:00:00
  # Each chain owns a separate team, so this is one training lane per chain.
  max_concurrent_jobs: 1

evaluation:
  memory: max
  max_truncation_rate: 0.20
  # The pipeline launches one isolated evaluator for each chain.
  workers: 1
  gpus_per_worker: 4
  time_limit: 7-00:00:00
  idle_seconds: 604200
  on_demand: false
  # Emit vLLM scheduler throughput, request, prefix-cache, and KV-cache stats.
  vllm_log_stats: true

agent:
  backend: claude

data_generation:
  # The research model authors and validates each method's data-generation code.
  # No AutoData plugin, broker, recipe, workspace, or production export is used.
  backend: native
  # Bound synchronous target generations so method smoke timing extrapolates
  # safely inside the intended data-generation/training budget.
  max_sequential_target_generations: 256
