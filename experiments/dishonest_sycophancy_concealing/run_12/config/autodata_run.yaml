schema: aar.autodata.run-config/v1
run_id: run12
chains:
  - alpha
  - beta
  - gamma
  - delta
  - epsilon
target_pairs_per_chain: 5
bootstrap_canary:
  # Fail-closed fallback for direct bootstrap-mode use. The canonical Canary 2
  # entrypoint supplies canary/canary_2/trial_2/autodata_run.yaml instead.
  stop_after: production
deployments:
  researcher_kimi: aar_8-kimi26
  generator_kimi: autodata_8-kimi26
budget:
  max_cost_usd: "299"
authoring:
  # Entire native workspace lifecycle: grounding/pipeline actions, approvals,
  # checks, and the two model-backed dry-run tasks.
  max_wall_seconds: 1800
generation:
  # Retry only rejected candidates. Each retry receives bounded Gemma/Luna
  # feedback and must generate a materially different prompt/teacher answer.
  # Five attempts leave room to repair a teacher answer when a scarce hard
  # prompt is first discovered on attempt three. Teacher-only repair reuses the
  # measured target response and does not make another Gemma call.
  target_feedback_max_attempts: 5
meta_optimization:
  maximum_iterations: 3
  minimum_iterations: 3
  early_stop_patience: 3
  tuning_tasks: 64
  validation_tasks: 32
  test_tasks: 32
production:
  required_rows: 1000
  initial_tasks: 1250
  minimum_successful_task_fraction: 0.95
storage:
  # Run 12 keeps its established aar-runs/ and aar-checkpoints/ layout below
  # this root. Prune redundant _train copies; submitted adapters remain
  # available for target promotion because training exits after submission.
  root: /checkpoint/ram/{user}
  keep_checkpoints: false
evaluation:
  # "max" maps to Slurm --mem=0: all memory on the allocated evaluator node.
  memory: max
  max_truncation_rate: 0.20
agent:
  backend: kimi
  # A timed-out CLI turn is terminated and resumed from its persisted session.
  # This bounds one Kimi Code process, not the full AutoData lifecycle.
  turn_timeout_seconds: 1800
recipe_root: aar/autodata_recipes/dishonest_sycophancy_concealing
training_contract:
  objective: sft
  judge_rubric: recipe/judge_rubric.json
