schema: aar.autodata.run-config/v1
run_id: run12-canary2-trial3
runtime_profile: configs/autodata/target_aware_local_c32_v1.yaml
chains:
  - alpha
target_pairs_per_chain: 1
bootstrap_canary:
  stop_after: training_smoke
deployments:
  researcher_kimi: aar_8-kimi26
  generator_kimi: autodata_8-kimi26
budget:
  max_cost_usd: "299"
authoring:
  # Native AutoData requires a positive wall value. In observe-only mode this
  # matches the outer seven-day controller envelope and is not a stage deadline.
  max_wall_seconds: 604800
stage_timing:
  mode: observe_only
  native_schema_wall_seconds: 604800
generation:
  target_feedback_max_attempts: 5
meta_optimization:
  maximum_iterations: 3
  minimum_iterations: 3
  early_stop_patience: 3
  tuning_tasks: 64
  validation_tasks: 32
  test_tasks: 32
production:
  required_rows: 1000
  initial_tasks: 1250
  minimum_successful_task_fraction: 0.95
storage:
  root: /checkpoint/ram/{user}
  keep_checkpoints: false
evaluation:
  memory: max
  max_truncation_rate: 0.20
agent:
  backend: kimi
  turn_timeout_seconds: 1800
recipe_root: aar/autodata_recipes/dishonest_sycophancy_concealing_v1
training_contract:
  objective: sft
  judge_rubric: recipe/judge_rubric.json
